name: Build TM APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NOTE: android-actions/setup-android@v3 is NOT used here: it tries
      # `sdkmanager tools`, an obsolete package that no longer exists in
      # the Android repository, and fails. The ubuntu runner already has
      # an Android SDK preinstalled; just add the exact packages we need.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build perf APK
        run: ./gradlew :app:assemblePerf --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TM手机Agent-perf-apk
          path: app/build/outputs/apk/perf/*.apk
          if-no-files-found: error
